stages:
  - prepare
  - deploy

prepare_site:
  stage: prepare
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p dist
    - cp ./*.html app.js styles.css sitemap.xml dist/
    - cp -R assets es dist/
    - |
      # Seguridad por entorno (auditoría 2026-09-22):
      #  - robots.txt: dev bloquea rastreo; prod permite + sitemap.
      #  - <meta robots noindex>: SOLO en dev (el código fuente no lo lleva).
      #  - CSP en <meta> (paliativo hasta tener cabeceras en CloudFront); dev añade los hosts de Google del Modo Review.
      #  Si se configura un webhook de leads (H2), añadir su host a connect-src de AMBAS.
      CSP_PROD="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
      CSP_DEV="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://script.google.com https://script.googleusercontent.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        META="<meta name=\"robots\" content=\"noindex, nofollow\" /><meta http-equiv=\"Content-Security-Policy\" content=\"$CSP_DEV\" />"
        printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
      else
        META="<meta http-equiv=\"Content-Security-Policy\" content=\"$CSP_PROD\" />"
        printf 'User-agent: *\nAllow: /\nSitemap: https://valnatir.com/sitemap.xml\n' > dist/robots.txt
      fi
      for f in dist/*.html dist/es/*.html; do
        [ -f "$f" ] && sed -i "s#<meta charset=\"UTF-8\" />#&$META#" "$f"
      done
      echo "[seguridad] robots.txt + metas inyectados para $CI_COMMIT_BRANCH"
    - |
      # Leads: destino de los formularios (Apps Script "VALNATIR Leads"), en dev y prod.
      # Variable CI VALNATIR_LEADS_WEBHOOK (Masked, All environments). Sin ella, los formularios avisan y no envían.
      if [ -n "$VALNATIR_LEADS_WEBHOOK" ]; then
        for f in dist/*.html dist/es/*.html; do
          [ -f "$f" ] && sed -i "s#</body>#<script>window.VALNATIR_LEADS_WEBHOOK=\"$VALNATIR_LEADS_WEBHOOK\";</script></body>#" "$f"
        done
        echo "[leads] webhook inyectado"
      else
        echo "[leads] AVISO: VALNATIR_LEADS_WEBHOOK no definida; los formularios no enviarán"
      fi
    - |
      # Modo Review: SOLO en preproduction (dev). main/prod nunca lo incluyen.
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        mkdir -p dist/review
        cp review/web-review-mode.js review/review-auth.js dist/review/
        printf 'window.WEB_REVIEW_CONFIG={clientId:"%s",webhookUrl:"%s",projectName:"VALNATIR (preproduction)"};' \
          "779317312558-o4c5ppj20nnh0dpjfme83g9m2gdfj732.apps.googleusercontent.com" \
          "$VALNATIR_SHEETS_WEBHOOK" > dist/review/web-review-config.js
        for f in dist/*.html dist/es/*.html; do
          [ -f "$f" ] && sed -i 's#</body>#<script src="/review/web-review-config.js"></script><script src="/review/review-auth.js"></script><script src="/review/web-review-mode.js"></script></body>#' "$f"
        done
        echo "[review] Modo Review inyectado en preproduction (dev)"
      fi
    - find dist -type f -print | sort
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

.deploy:
  stage: deploy
  image:
    name: amazon/aws-cli:2.36.49
    entrypoint: [""]
  needs:
    - job: prepare_site
      artifacts: true
  script:
    - |
      : "${AWS_ACCESS_KEY_ID:?Missing AWS_ACCESS_KEY_ID}"
      : "${AWS_SECRET_ACCESS_KEY:?Missing AWS_SECRET_ACCESS_KEY}"
      : "${AWS_DEFAULT_REGION:?Missing AWS_DEFAULT_REGION}"
      : "${DEPLOY_BUCKET:?Missing deployment bucket}"
      : "${CLOUDFRONT_DISTRIBUTION_ID:?Missing CloudFront distribution ID}"
    - aws sts get-caller-identity
    - aws s3 sync dist/ "s3://${DEPLOY_BUCKET}/" --delete --cache-control "public,max-age=86400"
    - |
      aws s3 cp dist/ "s3://${DEPLOY_BUCKET}/" \
        --recursive \
        --exclude "*" \
        --include "*.html" \
        --include "*.xml" \
        --include "*.css" \
        --include "*.js" \
        --cache-control "no-cache,no-store,must-revalidate"
    - aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

deploy_dev:
  extends: .deploy
  variables:
    DEPLOY_BUCKET: "$S3_DEV_BUCKET"
    CLOUDFRONT_DISTRIBUTION_ID: "$CLOUDFRONT_DEV_DISTRIBUTION_ID"
  environment:
    name: preproduction
    url: "$DEV_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy_prod:
  extends: .deploy
  variables:
    DEPLOY_BUCKET: "$S3_PROD_BUCKET"
    CLOUDFRONT_DISTRIBUTION_ID: "$CLOUDFRONT_PROD_DISTRIBUTION_ID"
  environment:
    name: production
    url: "$PROD_URL"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
